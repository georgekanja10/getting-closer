<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Getting Closer — George Kanja · Mctaba Connect &amp; Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#102c30;
    --blue:#1d454d;
    --royal:#265a63;
    --orange:#f26147;
    --orange2:#ff8068;
    --ink:#ffffff;
    --dim:#9fc3bf;
    --teal:#1d454d;
    --coral:#f26147;
    --mint:#3bbea2;
    --line:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Poppins','Avenir Next','Segoe UI',system-ui,sans-serif;
    color:var(--ink);
    background:#08201f;
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;
    background:radial-gradient(125% 115% at 50% 10%, var(--royal) 0%, var(--blue) 46%, var(--navy) 100%);}
  .slide{
    position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    padding:7vw 8vw;opacity:0;transition:opacity .35s ease;
  }
  .slide.active{display:flex;opacity:1}

  /* shared chrome */
  #logo{position:fixed;top:3.8vh;left:3.4vw;height:5vh;z-index:8}
  #edition{position:fixed;top:4.6vh;right:3.4vw;z-index:8;color:var(--dim);
    font-size:clamp(10px,1.15vw,14px);letter-spacing:.26em;text-transform:uppercase;font-weight:500}
  #hud{position:fixed;bottom:2.6vh;right:3.2vw;color:var(--dim);font-size:12px;
    letter-spacing:.12em;font-variant-numeric:tabular-nums;z-index:8;opacity:.7}
  #bar{position:fixed;left:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--coral),var(--mint));width:0;transition:width .3s ease;z-index:9}
  .hint{position:fixed;bottom:2.6vh;left:3.2vw;color:rgba(255,255,255,.28);font-size:11px;letter-spacing:.05em;z-index:8}

  /* type */
  .kicker{color:var(--orange2);letter-spacing:.26em;text-transform:uppercase;
    font-size:clamp(11px,1.4vw,16px);font-weight:600;margin-bottom:3.4vh}
  h1{font-size:clamp(40px,7.6vw,112px);line-height:1.0;font-weight:800;letter-spacing:-.02em;max-width:15ch}
  h2{font-size:clamp(30px,5.6vw,82px);line-height:1.05;font-weight:700;letter-spacing:-.015em;max-width:19ch}
  .big{font-size:clamp(34px,6.6vw,98px);line-height:1.04;font-weight:800;letter-spacing:-.02em;max-width:15ch}
  .amber,.o{color:var(--orange2)}
  .dim{color:var(--dim)}
  .sub{margin-top:4vh;font-size:clamp(16px,2.2vw,28px);color:var(--dim);max-width:30ch;line-height:1.45;font-weight:400}
  .sub.tight{margin-top:2.6vh}

  /* speaker tag */
  .tag{display:inline-block;background:var(--orange);color:#fff;font-weight:700;
    text-transform:uppercase;letter-spacing:.16em;font-size:clamp(11px,1.3vw,15px);
    padding:.55em 1.1em;border-radius:7px}

  /* strike list */
  .strikes{display:flex;flex-direction:column;gap:1.7vh;margin-bottom:1vh}
  .strike{position:relative;display:inline-block;color:var(--dim);font-weight:600;
    font-size:clamp(24px,4.4vw,58px);line-height:1.1}
  .strike:after{content:"";position:absolute;left:-3%;right:-3%;top:54%;height:4px;
    background:var(--orange);transform:rotate(-2.5deg);border-radius:2px}

  /* TITLE slide */
  #s-title{align-items:flex-start;text-align:left;justify-content:center;padding-left:6vw}
  .title-wrap{max-width:60vw;z-index:3}
  .title-name{margin-top:7vh}
  .title-name .nm{font-size:clamp(22px,3vw,40px);font-weight:700;margin-top:1.4vh;letter-spacing:-.01em}
  .title-name .rl{color:var(--dim);font-size:clamp(14px,1.7vw,22px);margin-top:.6vh;font-weight:400}
  .portrait{position:absolute;right:0;top:0;bottom:0;width:48vw;z-index:1;overflow:hidden}
  .portrait img{height:100%;width:100%;object-fit:cover;object-position:88% center;filter:hue-rotate(-22deg) saturate(.9)}
  .portrait .fade{position:absolute;inset:0;
    background:linear-gradient(90deg, var(--navy) 12%, rgba(16,44,48,.85) 30%, rgba(16,44,48,.25) 50%, rgba(16,44,48,0) 66%);}
  .portrait .fade.b{background:linear-gradient(0deg, var(--navy) 0%, rgba(16,44,48,0) 24%);}
  .portrait .tint{position:absolute;inset:0;background:rgba(29,69,77,.34);mix-blend-mode:multiply}
  .datechip{position:absolute;left:6vw;bottom:7vh;background:var(--orange);color:#fff;
    border-radius:10px;padding:1.1vh 1.6vw;font-weight:600;z-index:3;
    font-size:clamp(13px,1.5vw,19px);display:flex;align-items:center;gap:.7em}
  .datechip b{font-size:clamp(22px,2.6vw,34px);font-weight:800;line-height:1}

  /* SECTION divider */
  .sec-no{font-size:clamp(70px,16vw,230px);font-weight:800;color:rgba(255,255,255,.10);line-height:.8;letter-spacing:-.04em}
  .sec-row{display:flex;align-items:center;gap:1.4vw;margin-bottom:2.5vh}
  .sec-label{font-size:clamp(28px,5.2vw,72px);font-weight:700;letter-spacing:-.01em;max-width:18ch}

  /* CLOSE / contact */
  .handles{margin-top:5vh;display:flex;gap:2.4vw;flex-wrap:wrap;justify-content:center;color:var(--dim);font-size:clamp(13px,1.6vw,20px)}
  .handles b{color:#fff;font-weight:600}

  /* angaze card */
  .angaze-card{margin-top:4.5vh;display:inline-block}
  .angaze-card img{height:clamp(40px,6vh,78px);display:block}
  .dots{position:absolute;display:flex;gap:14px}
  .dot{width:14px;height:14px;border-radius:50%}
  .dot.c{background:var(--coral)} .dot.m{background:var(--mint)}

  /* misc */
  .lead-in{color:var(--dim);font-weight:500;font-size:clamp(16px,2vw,26px);margin-bottom:2.4vh;letter-spacing:.02em}
  .note{position:fixed;left:0;right:0;bottom:0;background:#070d18;color:#cdd8ea;
    font-size:14px;line-height:1.55;padding:16px 24px;border-top:2px solid var(--orange);
    text-align:left;display:none;max-height:36vh;overflow:auto;z-index:20}
  .note.show{display:block}
  .note b{color:var(--orange2);font-weight:600}
  .note .t{color:#fff;font-weight:700}
</style>
</head>

/* 13 — SECTION 3 */
{ html:`<div class="sec-row"><span class="sec-no">03</span></div><div class="sec-label">What it <span class="o">really</span> was.</div>`,
  note:"" },

/* 13b — THE COMMON THREAD */
{ html:`<div class="lead-in">Every one of those was the same thing.</div>
  <div style="font-size:clamp(19px,3.2vw,42px);font-weight:600;line-height:1.55;max-width:24ch;text-align:left">
    Market research <span class="o">→</span> closer to markets.<br>
    Business plans <span class="o">→</span> closer to how founders think.<br>
    Code <span class="o">→</span> closer to how systems work.<br>
    TrafficBuddy <span class="o">→</span> closer to how people behave.<br>
    Content <span class="o">→</span> closer to how people respond.
  </div>`,
  note:"" },

/* 13c — THE THESIS */
{ html:`<div class="big">The closer you get to reality,<br>the harder it is to keep believing things that <span class="o">aren't true</span>.</div>`,
  note:"" },

/* 14 — THROUGHLINE */
{ html:`<div class="big">You don't plan your way in.<br>You get <span class="o">closer</span>, and it becomes clear.</div>`,
  note:"" },

/* 15 — INTERACTION */
{ html:`<h2>Clarity comes from <span class="o">interaction with reality</span>.</h2><div class="sub">Not random movement. Not blind hustle. Real contact with how things actually work.</div>`,
  note:"" },

/* 16 — FAR AWAY (+ light photography) */
{ html:`<h2>You can't see it from <span class="o">far away</span>.</h2><div class="sub">A different position reveals different things. Get close enough, and the opportunity is just... there.</div>`,
  note:"" },

/* 17 — SECTION 4 */
{ html:`<div class="sec-row"><span class="sec-no">04</span></div><div class="sec-label">So how do you actually <span class="o">do</span> it?</div>`,
  note:"" },

/* 17b — THE ENGINE */
{ html:`<div class="lead-in">The whole thing is just a loop:</div>
  <div style="font-size:clamp(22px,4.2vw,56px);font-weight:700;line-height:1.3;max-width:15ch">Get closer <span class="o">→</span> observe <span class="o">→</span> think <span class="o">→</span> share <span class="o">→</span> <span class="o">repeat</span></div>`,
  note:"" },

/* 18 — REFLECTION */
{ html:`<h2>Exposure is the input.<br><span class="o">Understanding</span> is the goal.</h2><div class="sub">Exposure without reflection is just consumption. Exposure <b style="color:#fff">plus</b> reflection becomes insight.</div>`,
  note:"" },

/* 19 — PORTFOLIO */
{ html:`<h2>Have one thing that <span class="o">pays</span>.<br>Try small things on the side.</h2><div class="sub">You can't explore forever — at some point, exploring is just hiding.</div>`,
  note:"" },

/* 20 — 2 HOURS */
{ html:`<div class="big">Getting closer costs<br><span class="o">2 hours</span>.</div><div class="sub">One honest conversation. One small thing you actually finish. One room you weren't invited to.</div>`,
  note:"" },

/* 21 — EXERCISE */
{ html:`<h2>Get close to a real <span class="o">problem</span> — right now.</h2><div class="sub">Turn to the person next to you. 60 seconds each.</div>`,
  note:"" },

/* 22 — SECTION 5 */
{ html:`<div class="sec-row"><span class="sec-no">05</span></div><div class="sec-label">The <span class="o">honest</span> stuff.</div>`,
  note:"" },

/* 23 — WIDE/DEEP */
{ html:`<h2>Try many things. Go <span class="o">deep</span> on one. Then connect it back.</h2><div class="sub">Breadth helps you discover. Depth lets you contribute. Connection is where creativity comes from.</div>`,
  note:"" },

/* 24 — MONEY (as proxy) + LUCK */
{ html:`<h2>Money matters — and it's usually a <span class="o">proxy</span>.</h2><div class="sub">for freedom · security · learning · ownership · optionality. Name what you're really chasing. (And luck? It finds people who show up.)</div>`,
  note:"" },

/* 25 — PAYOFF */
{ html:`<h2>My "random" path,<br>looking <span class="o">back</span>.</h2><div class="sub">Same facts. It only made sense once I'd moved.</div>`,
  note:"" },

/* 25b — THE TRANSFORMATION */
{ html:`<div class="lead-in">So here's the whole shift.</div><div class="big">You don't need certainty.<br>You need <span class="o">interaction</span>.</div><div class="sub">Stop waiting to know exactly where you're going. Start moving closer to something real.</div>`,
  note:"" },

/* 26 — ASK + CLOSE merged build */
{ html:`
  <div class="kicker">Your move — this week</div>
  <div class="big">One small step.<br>2 hours. Get <span class="o">closer</span>.</div>
  <div class="sub">Write it down now. Then tell one person here you'll do it.</div>
  <div class="handles"><span>mctaba.com/events</span><span><b>George Kanja</b> · Angazé Systems Group · TrafficBuddy.app</span></div>`,
  note:"" },
];

let i = 0;
const stage = document.getElementById('stage');
const note = document.getElementById('note');
let notesOn = false;

S.forEach(s=>{
  const d=document.createElement('div');
  d.className='slide'+(s.id?(' '+s.id):'');
  d.innerHTML=s.html;
  stage.appendChild(d);
});
const nodes=[...document.querySelectorAll('.slide')];

function render(){
  nodes.forEach((n,idx)=>n.classList.toggle('active',idx===i));
  document.getElementById('hud').textContent=String(i+1).padStart(2,'0')+' / '+S.length;
  document.getElementById('bar').style.width=((i+1)/S.length*100)+'%';
  note.innerHTML=S[i].note||'';
  note.classList.toggle('show',false);
}
function next(){if(i<S.length-1){i++;render();}}
function prev(){if(i>0){i--;render();}}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
  else if(e.key.toLowerCase()==='n'){notesOn=!notesOn;render();}
  else if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}
  else if(e.key==='Home'){i=0;render();}
  else if(e.key==='End'){i=S.length-1;render();}
});
stage.addEventListener('click',next);
render();
</script>
